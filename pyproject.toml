[project]
name = "phc"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "==3.8.*"

dependencies = [
  "chumpy",
  "gymnasium==0.29.1",
  "isaacgym",
  "smpl-sim",
  "smplx",
  "debugpy>=1.8.9",
  "aiohttp>=3.10.11",
  "scikit-image>=0.21.0",
  "termcolor>=2.4.0",
  "open3d>=0.18.0",
  "rl-games==1.1.4",
  "imageio[ffmpeg,pyav]>=2.35.1",
  "wandb>=0.19.0",
  "mujoco>=3.2.3",
  "pyvirtualdisplay>=3.0",
]

[tool.uv]
environments = ["platform_system == 'Linux'"]

[tool.uv.sources]
smplx = { git = "https://github.com/ZhengyiLuo/smplx.git", rev = "a5b8e4ac14f79f3f33fd2cf2a16e6f507146b813" }
isaacgym = { path = "isaacgym/python", editable = true }
smpl-sim = { git = "https://github.com/ZhengyiLuo/SMPLSim.git", rev = "master" }
chumpy = { git = "https://github.com/mattloper/chumpy" }
