# if given, will override the device setting in gym. 
task: HumanoidAMPHeading
project_name: "amp_heading"
notes:  ""
motion_file: ""
num_envs: 1280
env_spacing: 5
episode_length: 300
is_flag_run: False
enable_debug_vis: False

heading_reward:
  distance_threshold: 0.5
  target_speed: 1.0
  target_range:
    x: [-10, 10]
    y: [-10, 10]
  pos_reward_scale: 0.5
  speed_reward_scale: 0.5
  pos_reward_weight: 0.6
  speed_reward_weight: 0.2
  dir_reward_weight: 0.2
heading_termination_distance: 0.5

fut_tracks: False
self_obs_v: 1
obs_v: 6
auto_pmcp: False
auto_pmcp_soft: True

cycle_motion: False
hard_negative: False
min_length: 5

kp_scale: 1
power_reward: True

shape_resampling_interval: 500

control_mode: "isaac_pd"
power_scale: 1.0
controlFrequencyInv: 2 # 30 Hz
stateInit: "Random"  
hybridInitProb: 0.5
numAMPObsSteps: 10

local_root_obs: True
root_height_obs: True
key_bodies: ["R_Ankle", "L_Ankle", "R_Wrist",  "L_Wrist"]
contact_bodies: ["R_Ankle", "L_Ankle", "R_Toe", "L_Toe"]
reset_bodies: ['Pelvis', 'L_Hip', 'L_Knee', 'R_Hip', 'R_Knee', 'Torso', 'Spine', 'Chest', 'Neck', 'Head', 'L_Thorax', 'L_Shoulder', 'L_Elbow', 'L_Wrist', 'L_Hand', 'R_Thorax', 'R_Shoulder', 'R_Elbow', 'R_Wrist', 'R_Hand']
terminationHeight: 0.15
enableEarlyTermination: True
terminationDistance: 0.25

### Fut config
numTrajSamples: 3
trajSampleTimestepInv: 3
enableTaskObs: True


plane:
  staticFriction: 1.0
  dynamicFriction: 1.0
  restitution: 0.0
